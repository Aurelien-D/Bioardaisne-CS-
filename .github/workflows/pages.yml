# Publie la version solo du jeu sur GitHub Pages à chaque mise à jour de main.
# Réglage requis une seule fois : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chemins relatifs (le site vit dans un sous-dossier) et mode solo (pas de serveur de jeu sur Pages).
      - run: npm run build:client
        env:
          BAS_BASE: ./
          BAS_STATIC: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
