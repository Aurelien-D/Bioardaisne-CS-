<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioArd'Aisne Strike — visionneuse de carte</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1420;
        font-family: 'Segoe UI', Inter, Arial, 'Liberation Sans', sans-serif;
        color: #eaf6fe;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
      }
      .panel {
        position: fixed;
        left: 10px;
        padding: 7px 10px;
        background: rgba(0, 30, 56, 0.72);
        border-left: 3px solid #3182ce;
        border-radius: 3px;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
      }
      #overlay {
        top: 10px;
      }
      #help {
        bottom: 10px;
        opacity: 0.85;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0b1420;
        font-size: 15px;
      }
      #loading .bar {
        width: min(420px, 70vw);
        height: 8px;
        background: rgba(255, 255, 255, 0.14);
        border-radius: 4px;
        overflow: hidden;
      }
      #loading .fill {
        height: 100%;
        width: 0;
        background: #3182ce;
        transition: width 0.12s linear;
      }
      #loading.error {
        color: #ff8b92;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="overlay" class="panel"></div>
    <div id="help" class="panel"></div>
    <div id="loading">
      <div id="loading-label">Chargement…</div>
      <div class="bar"><div class="fill" id="loading-fill"></div></div>
    </div>
    <script type="module" src="/src/client/dev/viewer.ts"></script>
  </body>
</html>
