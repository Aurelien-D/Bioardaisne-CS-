<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioArd'Aisne Strike — banc d'essai du HUD</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05101d;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #help {
        position: fixed;
        left: 50%;
        bottom: 6px;
        z-index: 100;
        transform: translateX(-50%);
        padding: 3px 10px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 3px;
        color: #c8f5e4;
        font: 11px/1.5 ui-monospace, Consolas, monospace;
        white-space: nowrap;
        pointer-events: none;
      }
      #help:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Stand-in for the game canvas: a still "screenshot" of a lab corridor behind the HUD. -->
    <canvas id="scene"></canvas>
    <div id="hud"></div>
    <div id="help"></div>
    <script type="module" src="/src/client/dev/hud.ts"></script>
  </body>
</html>
