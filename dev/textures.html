<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioArd'Aisne Strike — galerie des textures</title>
    <style>
      html,
      body {
        margin: 0;
        background: #1b222b;
        font-family: 'Segoe UI', Inter, Arial, 'Liberation Sans', sans-serif;
        color: #eaf6fe;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: baseline;
        gap: 18px;
        padding: 8px 14px;
        background: rgba(0, 30, 56, 0.94);
        border-bottom: 3px solid #3182ce;
        font-size: 13px;
      }
      header h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      header a {
        color: #9fd0ff;
        text-decoration: none;
        margin-right: 8px;
      }
      header a.on {
        color: #fff;
        font-weight: 600;
        text-decoration: underline;
      }
      #stats {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        opacity: 0.9;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--cell, 330px), 1fr));
        gap: 12px;
        padding: 12px;
      }
      .swatch {
        background: #111820;
        border-radius: 4px;
        padding: 6px;
      }
      .swatch canvas {
        display: block;
        width: 100%;
        height: auto;
        image-rendering: auto;
      }
      .swatch .row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 5px;
        font-size: 12px;
        line-height: 1.3;
      }
      .swatch .id {
        font-weight: 600;
        font-size: 13px;
      }
      .swatch .meta {
        margin-left: auto;
        opacity: 0.75;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .chip {
        display: inline-block;
        width: 26px;
        height: 14px;
        border: 1px solid rgba(255, 255, 255, 0.35);
      }
      .warn {
        color: #ffb35c;
      }
      .desc {
        opacity: 0.7;
        font-size: 11px;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Galerie des textures</h1>
      <nav id="nav"></nav>
      <span id="stats">Génération…</span>
    </header>
    <div id="grid"></div>
    <script type="module" src="/src/client/dev/textures.ts"></script>
  </body>
</html>
