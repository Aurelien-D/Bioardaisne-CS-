<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioArd'Aisne Strike — revue des armes</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #6b7480;
        font-family: 'Segoe UI', Inter, Arial, 'Liberation Sans', sans-serif;
        color: #eaf6fe;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .panel {
        position: fixed;
        left: 10px;
        padding: 7px 10px;
        background: rgba(0, 30, 56, 0.78);
        border-left: 3px solid #3182ce;
        border-radius: 3px;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre;
        font-variant-numeric: tabular-nums;
      }
      #overlay {
        top: 10px;
        pointer-events: none;
      }
      #nav {
        bottom: 10px;
        white-space: normal;
        max-width: calc(100vw - 40px);
      }
      #nav a {
        color: #9fd0ff;
        text-decoration: none;
        margin-right: 9px;
      }
      #nav a.on {
        color: #fff;
        font-weight: 600;
        text-decoration: underline;
      }
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #labels span {
        position: absolute;
        transform: translate(7px, -50%);
        padding: 0 4px;
        font-size: 11px;
        line-height: 15px;
        border-radius: 2px;
        background: rgba(0, 0, 0, 0.62);
        white-space: nowrap;
      }
      #labels span.tag {
        transform: none;
        background: rgba(0, 30, 56, 0.78);
        font-size: 12px;
        line-height: 18px;
      }
      .error {
        color: #ff8b92;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="labels"></div>
    <div id="overlay" class="panel">Chargement…</div>
    <div id="nav" class="panel"></div>
    <script type="module" src="/src/client/dev/weapons.ts"></script>
  </body>
</html>
